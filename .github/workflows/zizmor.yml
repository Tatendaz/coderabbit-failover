name: zizmor

# Static security scan of the workflows themselves (unpinned actions, template
# injection, over-broad tokens). Fails on high-severity findings.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install zizmor (pinned by hash)
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r .github/zizmor-requirements.txt

      # The read-only token turns on zizmor's online audits (impostor commits,
      # known-vulnerable actions). --strict-collection fails on a workflow it can't parse.
      - name: Scan workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --min-severity high .github/workflows
