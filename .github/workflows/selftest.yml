name: Self-tests

# Offline logic checks for the budget ledger, the review-status probe, and the backup
# reviewer's worker pool. All use only the Python standard library and touch no network.
# The reusable merge-when-clean workflow's tests use pytest (pinned by hash) and a fake `gh`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Budget ledger self-test
        run: python3 scripts/coderabbit_budget.py selftest
      - name: Review-status self-test
        run: python3 scripts/coderabbit_status.py --selftest
      - name: Backup reviewer tests
        run: python3 -m unittest discover -s tests -v

  merge-when-clean:
    name: merge-when-clean tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest (pinned by hash)
        run: python -m pip install --quiet --disable-pip-version-check --require-hashes -r tests/merge_when_clean/requirements.txt
      - name: Reusable merge-when-clean tests
        run: python -m pytest tests/merge_when_clean -v -p no:cacheprovider
      # Self-hosted Mac runners may run the job with the system bash 3.2.
      - name: Same tests with /bin/bash
        if: runner.os == 'macOS'
        env:
          MWC_BASH: /bin/bash
        run: python -m pytest tests/merge_when_clean -q -p no:cacheprovider
