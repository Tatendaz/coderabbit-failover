name: Self-tests

# Offline logic checks for the budget ledger, the review-status probe, and the backup
# reviewer's worker pool. All use only the Python standard library and touch no network.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    name: Self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Budget ledger self-test
        run: python3 scripts/coderabbit_budget.py selftest
      - name: Review-status self-test
        run: python3 scripts/coderabbit_status.py --selftest
      - name: Backup reviewer tests
        run: python3 -m unittest discover -s tests -v
