name: Merge when clean (reusable)

# Shared merge-when-clean job. Each repo calls it from a short
# `.github/workflows/merge-when-clean.yml` that pins this file to a full commit sha:
#
#   uses: Tatendaz/coderabbit-failover/.github/workflows/reusable-merge-when-clean.yml@<sha> # merge-when-clean-v1.0.0
#
# Merges an open PR into the default branch once it is clean on its head commit:
#   1. every check run and commit status finished green,
#   2. a real review ran on that commit: CodeRabbit "Review completed", or the
#      owner's backup review (`review-failover` = success, posted by the owner),
#   3. 0 unresolved review threads, no "changes requested" review, no merge conflicts,
#      and at least one CI check ran. Anything it cannot read in full blocks the merge.
# Covers only PRs that opt in: Dependabot PRs (not major updates), and the owner's PRs from a
# `security/` branch or labelled `automerge`. Other PRs are left to the owner and
# to Claude sessions working under the merge-when-clean rule. Skips drafts, forks, Night Shift PRs,
# PRs labelled `needs-owner` / `do-not-merge`, and PRs that touch database rules,
# migrations, infra, the caller or this file, or a path listed in the repo's optional
# `.github/merge-hold-paths` (one regex per line, read from the default branch).
# Owner decision 2026-10-25. Logic = template v7; tests in tests/merge_when_clean/test_merge_when_clean.py.
#
# The caller sets the triggers, the token permissions (contents/pull-requests write,
# checks/statuses read) and the `status` success `if`. It must not set a concurrency group
# named `merge-when-clean`: this job holds that group, and a caller holding it too deadlocks.
# A merge made with GITHUB_TOKEN does not start other workflows, so a deploy that
# runs `on: push` to the default branch will not fire after an automatic merge.
on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner labels as JSON, for example "ubuntu-latest" or ["self-hosted","macOS","ARM64"]'
        type: string
        default: '"ubuntu-latest"'

permissions: {}

jobs:
  merge:
    name: Merge when clean
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    concurrency:
      group: merge-when-clean
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Merge every clean PR
        shell: bash
        run: |
          set -uo pipefail
          # GitHub runs `shell: bash` as `bash -e -o pipefail`. This script checks every exit code
          # itself (grep exits 1 on "no match"), so -e must be off or the job dies before rc=$?.
          set +e
          # A failed read turns the run red, so "checked nothing" never looks like "nothing to do".
          base=$(gh api "repos/$REPO" --jq .default_branch) && [ -n "$base" ] \
            || { echo "could not read the default branch; merging nothing"; exit 1; }
          prs=$(gh api --paginate "repos/$REPO/pulls?state=open&base=$base&per_page=100" \
            --jq ".[] | select(.draft==false) | select(.head.repo.full_name==\"$REPO\")
                 | select(.user.login==\"dependabot[bot]\" or (.user.login==\"$OWNER\"
                     and ((.head.ref | startswith(\"security/\")) or any(.labels[]; .name==\"automerge\")))) | .number") \
            || { echo "could not list open PRs; merging nothing"; exit 1; }
          [ -z "$prs" ] && { echo "no open PRs to check"; exit 0; }

          # Optional per-repo hold list: one extended regex per line, matched against changed
          # paths. Read from the default branch, never from the PR. Unreadable (other than
          # missing) means merge nothing this run.
          err=$(mktemp)
          if hold=$(gh api "repos/$REPO/contents/.github/merge-hold-paths?ref=$base" \
                      -H "Accept: application/vnd.github.raw" 2>"$err"); then
            hold=$(grep -vE '^[[:space:]]*(#|$)' <<<"$hold" || true)
          elif grep -q 'HTTP 404' "$err"; then
            hold=""
          else
            echo "could not read .github/merge-hold-paths: $(head -c 200 "$err"); merging nothing"; exit 1
          fi
          if [ -n "$hold" ]; then
            echo "hold paths: $(tr '\n' ' ' <<<"$hold")"
            # grep exits 2 on a bad pattern; a broken hold list must not read as "no match".
            grep -Eq -f <(printf '%s\n' "$hold") </dev/null; rc=$?
            if [ "$rc" -gt 1 ]; then echo "bad regex in .github/merge-hold-paths (grep $rc); merging nothing"; exit 1; fi
          fi

          # 0 when any "from A to B" in the text changes the major version (or the minor of a 0.x).
          is_major() {
            local a b seen=no
            while read -r a b; do
              seen=yes; a=${a#v}; a=${a%.}; b=${b#v}; b=${b%.}
              [ "${a%%.*}" != "${b%%.*}" ] && return 0
              [ "${a%%.*}" = 0 ] && [ "$(cut -d. -f2 <<<"$a")" != "$(cut -d. -f2 <<<"$b")" ] && return 0
            done < <(grep -oE 'from v?[0-9][0-9A-Za-z.+-]* to v?[0-9][0-9A-Za-z.+-]*' | awk '{print $2, $4}')
            # No version found: treat as major, so a person looks at it.
            [ "$seen" = no ]
          }

          check_pr() {
            local pr=$1 j sha title body summary author labels changed files paths rc runs total pending failed st bad fo fo_open cr reviewed gql decision more unresolved changes
            j=$(gh api "repos/$REPO/pulls/$pr") || { echo "#$pr: could not read the PR"; read_failed=1; return; }
            sha=$(jq -r .head.sha <<<"$j")
            title=$(jq -r '.title // ""' <<<"$j")
            body=$(jq -r '.body // ""' <<<"$j")
            author=$(jq -r .user.login <<<"$j")
            labels=$(jq -r '[.labels[].name] | join(",")' <<<"$j")
            case ",$labels," in *,needs-owner,*|*,do-not-merge,*) echo "#$pr: skip (label)"; return;; esac
            if grep -q 'Tatendaz/ideas-inbox#17' <<<"$body"; then echo "#$pr: skip (Night Shift PR)"; return; fi
            # Only the title and Dependabot's own summary lines: release notes quoted in the body
            # often say "from 1.x to 2.x" and would mark a minor update as major.
            summary=$(grep -E '^(Updates `|Bumps \[)' <<<"$body" || true)
            if [ "$author" = "dependabot[bot]" ] && is_major <<<"$title"$'\n'"$summary"; then
              echo "#$pr: skip (Dependabot major update; a person merges these)"; return
            fi

            # Fail closed: if the file list cannot be read in full, do not merge.
            changed=$(jq -r .changed_files <<<"$j")
            files=$(gh api --paginate "repos/$REPO/pulls/$pr/files?per_page=100" \
              --jq '.[] | "\(.filename)\t\(.previous_filename // "")"') || { echo "#$pr: could not read the file list"; read_failed=1; return; }
            if [ -z "$files" ] || [ "$(grep -c . <<<"$files")" != "$changed" ]; then
              echo "#$pr: file list incomplete ($changed changed); not merging"; return
            fi
            # No pipes into grep -q: under pipefail an early grep exit can turn a match into a failure.
            paths=$(tr '\t' '\n' <<<"$files")
            grep -Eq '(^|/)(firestore\.rules|storage\.rules|database\.rules\.json)$|(^|/)migrations/|(^|/)terraform/|\.tf$|^\.github/workflows/(reusable-)?merge-when-clean\.yml$|^\.github/merge-hold-paths$' <<<"$paths"; rc=$?
            if [ "$rc" != 1 ]; then echo "#$pr: skip (touches files the owner merges, or the check failed: $rc)"; return; fi
            if [ -n "$hold" ]; then
              grep -Eq -f <(printf '%s\n' "$hold") <<<"$paths"; rc=$?
              if [ "$rc" != 1 ]; then echo "#$pr: skip (matches .github/merge-hold-paths, or the check failed: $rc)"; return; fi
            fi
            if [ "$(jq -r .mergeable_state <<<"$j")" = "dirty" ]; then echo "#$pr: merge conflicts"; return; fi

            runs=$(gh api --paginate "repos/$REPO/commits/$sha/check-runs?per_page=100" --jq '.check_runs[]' \
              | jq -s '[.[] | select(.name!="Merge when clean" and (.name | endswith(" / Merge when clean") | not))] | group_by(.name) | map(max_by(.started_at))') \
              || { echo "#$pr: could not read checks"; read_failed=1; return; }
            total=$(jq length <<<"$runs")
            pending=$(jq '[.[] | select(.status!="completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status=="completed" and ((.conclusion // "") | IN("success","neutral","skipped") | not))] | length' <<<"$runs")

            st=$(gh api --paginate "repos/$REPO/commits/$sha/statuses?per_page=100" --jq '.[]' \
              | jq -s 'group_by(.context) | map(sort_by(.created_at) | last)') \
              || { echo "#$pr: could not read statuses"; read_failed=1; return; }
            bad=$(jq '[.[] | select(.context!="CodeRabbit" and .context!="review-failover") | select(.state!="success")] | length' <<<"$st")
            fo=$(jq -r '[.[] | select(.context=="review-failover")][0] | "\(.state // "none") \(.creator.login // "-")"' <<<"$st")
            cr=$(jq -r '[.[] | select(.context=="CodeRabbit")][0] | "\(.state // "none") \(.creator.login // "-") \(.description // "")"' <<<"$st")
            reviewed=no
            [ "$fo" = "success $OWNER" ] && reviewed=yes
            case "$cr" in "success coderabbitai[bot] "*"Review completed"*) reviewed=yes;; esac
            # The owner's backup review failing or still running blocks, even after CodeRabbit passed.
            fo_open=no
            case "$fo" in "failure $OWNER"|"error $OWNER"|"pending $OWNER") fo_open=yes;; esac

            # reviewDecision is null when no rule requires reviews, so also read each reviewer's
            # latest opinionated review and block on any CHANGES_REQUESTED.
            # shellcheck disable=SC2016  # GraphQL variables, not shell
            gql=$(gh api graphql -f query='query($o:String!,$n:String!,$pr:Int!){ repository(owner:$o,name:$n){ pullRequest(number:$pr){
                reviewDecision
                latestOpinionatedReviews(first:100){ nodes{ state } }
                reviewThreads(first:100){ pageInfo{ hasNextPage } nodes{ isResolved } } } } }' \
                -f o="${REPO%/*}" -f n="${REPO#*/}" -F pr="$pr" \
              --jq '.data.repository.pullRequest | "\(.reviewDecision // "NONE") \(.reviewThreads.pageInfo.hasNextPage) \([.reviewThreads.nodes[] | select(.isResolved==false)] | length) \([.latestOpinionatedReviews.nodes[] | select(.state=="CHANGES_REQUESTED")] | length)"') \
              || { echo "#$pr: could not read reviews"; read_failed=1; return; }
            read -r decision more unresolved changes <<<"$gql"

            echo "#$pr $sha: checks=$total pending=$pending failed=$failed, other statuses not green=$bad, reviewed=$reviewed, backup review=${fo%% *}, decision=$decision, changes requested=$changes, unresolved threads=$unresolved (more=$more)"
            if [ "$total" = 0 ]; then echo "#$pr: no CI checks on this commit yet"; return; fi
            if [ "$pending" != 0 ] || [ "$failed" != 0 ] || [ "$bad" != 0 ] || [ "$reviewed" != yes ] || [ "$fo_open" = yes ] \
               || [ "$decision" = CHANGES_REQUESTED ] || [ "$changes" != 0 ] || [ "$more" != false ] || [ "$unresolved" != 0 ]; then
              echo "#$pr: not clean yet"; return
            fi
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$sha" \
              && echo "#$pr: merged" || echo "#$pr: GitHub refused the merge"
          }

          # Oldest first, so a stacked PR's base merges before the PR built on it.
          read_failed=0
          while read -r pr; do check_pr "$pr" </dev/null; done < <(sort -n <<<"$prs")
          if [ "$read_failed" != 0 ]; then echo "some PRs could not be read (see above); they were not merged"; exit 1; fi
